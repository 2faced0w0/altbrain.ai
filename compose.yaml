services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: worktracker
      POSTGRES_USER: worktracker
      POSTGRES_PASSWORD: local_only
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["tracker_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worktracker"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7.4.2-alpine
    ports: ["127.0.0.1:6379:6379"]
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    profiles: ["auth"]
    command: ["start-dev", "--import-realm", "--hostname=http://127.0.0.1:8088"]
    env_file:
      - path: .local/auth/keycloak.env
        required: false
    ports: ["127.0.0.1:8088:8080"]
    volumes:
      - tracker_keycloak:/opt/keycloak/data
      - ./.local/auth/import:/opt/keycloak/data/import:ro
    depends_on: [mailpit]
  mailpit:
    image: axllent/mailpit:v1.31.3
    profiles: ["auth"]
    ports: ["127.0.0.1:8025:8025"]
    environment:
      MP_MAX_MESSAGES: "200"
      MP_DATABASE: /data/mailpit.db
    volumes: ["tracker_mailpit:/data"]
volumes:
  tracker_keycloak:
  tracker_mailpit:
  tracker_pg:
