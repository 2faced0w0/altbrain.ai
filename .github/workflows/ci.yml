name: Foundation checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: tracker_ci
          POSTGRES_USER: tracker_ci
          POSTGRES_PASSWORD: ci_only
        ports: [5432:5432]
        options: --health-cmd "pg_isready -U tracker_ci" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: 'npm'}
      - run: pip install -r services/api/requirements.txt
      - run: npm ci
      - run: python -m pytest -q
      - run: python -m pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://tracker_ci:ci_only@127.0.0.1:5432/tracker_ci
      - run: python -m ruff check services scripts
      - run: npm run contracts
      - run: git diff --exit-code -- packages/contracts/openapi.json apps/web/src/schema.d.ts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npx playwright test --config playwright.ai.config.ts
